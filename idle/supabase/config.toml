project_id = "rosqtabfzpopekfdimrn"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "idle://auth-callback"
additional_redirect_urls = ["idle://auth-callback", "https://idle.app/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Minimum age is enforced in the app (16 EU / 13 elsewhere) — see docs/COMPLIANCE.md
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Enabled once the Apple service id and key exist — see docs/SETUP.md. Leaving
# these on with empty env vars makes `supabase config push` fail, and pushing a
# half-configured provider is worse than not pushing one.
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[functions.pair]
verify_jwt = false

[functions.heartbeat]
verify_jwt = false

# Called by pg_cron, which carries no user session. Authenticates on
# IDLE_CRON_SECRET instead — see docs/SETUP.md.
[functions.notify]
verify_jwt = false
