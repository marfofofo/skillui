<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Remote">
  <meta name="theme-color" content="#151311" id="themeColor">
  <script>
    // Applica il tema prima del primo disegno, per evitare lampi di colore.
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("theme") || "auto"; } catch (e) {}
      var light = pref === "light" || (pref === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.dataset.theme = light ? "light" : "dark";
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="style.css">
  <title>AI Remote</title>
</head>
<body data-state="offline">
  <div class="grain" aria-hidden="true"></div>

  <header class="bar">
    <div class="brand">
      <span class="led" aria-hidden="true"></span>
      <span class="mono">AI·REMOTE</span>
      <span id="host" class="mono dim">—</span>
    </div>
    <nav class="keys">
      <button id="historyBtn" class="key" aria-label="Cronologia">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <button id="themeToggle" class="key" aria-label="Tema" data-mode="auto">
        <svg viewBox="0 0 24 24">
          <g class="t-auto"><circle cx="12" cy="12" r="7.5"/><path class="fill" d="M12 4.5a7.5 7.5 0 0 1 0 15z"/></g>
          <g class="t-light"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g>
          <g class="t-dark"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></g>
        </svg>
      </button>
      <button id="speakToggle" class="key" aria-label="Voce" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M16 9l6 6M22 9l-6 6"/></svg>
      </button>
      <button id="reset" class="key" aria-label="Nuova conversazione">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
      </button>
    </nav>
  </header>

  <section class="clock" aria-hidden="true">
    <p id="clockTime" class="clock-time">--:--</p>
    <p id="clockDate" class="clock-date mono"></p>
  </section>

  <main class="display">
    <p id="stateLabel" class="state mono">Connessione</p>
    <p id="heard" class="heard"></p>
    <p id="reply" class="reply">Tocca il cerchio<br><em>e parla.</em></p>
    <ol id="ticker" class="ticker mono" aria-live="polite"></ol>
  </main>

  <section class="deck">
    <button id="orbBtn" class="orb" aria-label="Parla">
      <canvas id="orb" aria-hidden="true"></canvas>
      <span id="orbHint" class="orb-hint mono">PARLA</span>
    </button>

    <form id="form" class="type" autocomplete="off">
      <input id="text" type="text" placeholder="oppure scrivi un comando" enterkeyhint="send" aria-label="Comando">
      <button type="submit" class="go mono" aria-label="Invia">INVIO</button>
    </form>
  </section>

  <!-- Conferma: si tiene premuto come un tasto fisico -->
  <div id="approval" class="approval" hidden>
    <p class="mono approval-kicker">Richiede conferma</p>
    <p id="approvalName" class="approval-title"></p>
    <pre id="approvalDetail" class="approval-detail mono"></pre>
    <div class="approval-actions">
      <button id="deny" class="deny mono">Annulla</button>
      <button id="allow" class="hold" aria-label="Tieni premuto per eseguire">
        <span class="hold-fill"></span>
        <span class="hold-label mono">Tieni premuto per eseguire</span>
      </button>
    </div>
  </div>

  <!-- Cronologia -->
  <div id="history" class="history" hidden>
    <div class="history-head">
      <span class="mono">Cronologia</span>
      <button id="historyClose" class="key" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <ol id="log" class="log"></ol>
  </div>

  <script src="app.js"></script>
</body>
</html>
