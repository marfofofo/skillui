<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Remote">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>AI Remote</title>
</head>
<body>
  <header>
    <div class="conn"><span id="dot" class="dot"></span><span id="host">Connessione…</span></div>
    <div class="actions">
      <button id="speakToggle" class="chip" aria-pressed="true" title="Voce">🔊</button>
      <button id="reset" class="chip" title="Nuova conversazione">↺</button>
    </div>
  </header>

  <main>
    <div id="log" class="log" aria-live="polite"></div>
  </main>

  <section class="controls">
    <div id="live" class="live"></div>
    <button id="mic" class="mic" aria-label="Parla">
      <span class="ring"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
    <form id="form" class="form" autocomplete="off">
      <input id="text" type="text" placeholder="Scrivi o detta un comando…" enterkeyhint="send">
      <button type="submit" class="send" aria-label="Invia">↑</button>
    </form>
  </section>

  <div id="approval" class="sheet" hidden>
    <div class="sheet-card">
      <p class="sheet-title">Posso eseguire questa azione sul Mac?</p>
      <p id="approvalName" class="sheet-name"></p>
      <pre id="approvalDetail" class="sheet-detail"></pre>
      <div class="sheet-buttons">
        <button id="deny" class="btn">No</button>
        <button id="allow" class="btn primary">Sì, esegui</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
