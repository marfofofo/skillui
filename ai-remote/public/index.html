<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Remote">
  <meta name="theme-color" content="#151311" id="themeColor">
  <script>
    // Applica il tema prima del primo disegno, per evitare lampi di colore.
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("theme") || "auto"; } catch (e) {}
      var light = pref === "light" || (pref === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.dataset.theme = light ? "light" : "dark";
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>AI Remote</title>
</head>
<body data-state="offline">
  <!-- Bagliore sui bordi dello schermo mentre ascolta o risponde -->
  <div class="edge" aria-hidden="true"><div class="edge-ring"></div><div class="edge-ring blur"></div></div>

  <header class="top">
    <div class="pill material" id="connPill">
      <span class="dot" aria-hidden="true"></span>
      <span id="host">Connessione…</span>
    </div>
    <button id="menuBtn" class="round material" aria-label="Altro" aria-haspopup="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg>
    </button>
  </header>

  <section class="clock" aria-hidden="true">
    <p id="clockDate" class="clock-date"></p>
    <p id="clockTime" class="clock-time">--:--</p>
  </section>

  <main class="stage">
    <article id="card" class="card material" hidden>
      <p id="heard" class="heard"></p>
      <p id="reply" class="reply"></p>
      <ul id="steps" class="steps" aria-live="polite"></ul>
    </article>
  </main>

  <section class="dock">
    <button id="orbBtn" class="orb" aria-label="Parla">
      <canvas id="orb" aria-hidden="true"></canvas>
    </button>
    <p id="caption" class="caption">Tocca per parlare</p>

    <form id="form" class="field material" autocomplete="off">
      <input id="text" type="text" placeholder="Chiedi ad AI Remote" enterkeyhint="send" aria-label="Comando">
      <button type="submit" class="send" aria-label="Invia">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
      </button>
    </form>
  </section>

  <!-- Menu a comparsa -->
  <div id="menuScrim" class="scrim clear" hidden></div>
  <div id="menu" class="menu material-thick" role="menu" hidden>
    <div class="menu-section">
      <p class="menu-label">Aspetto</p>
      <div class="segmented" role="radiogroup" aria-label="Tema">
        <span class="seg-thumb" aria-hidden="true"></span>
        <button role="radio" data-theme-pref="auto">Auto</button>
        <button role="radio" data-theme-pref="light">Chiaro</button>
        <button role="radio" data-theme-pref="dark">Scuro</button>
      </div>
    </div>
    <label class="menu-row">
      <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M4 10v4h3.5L12 18V6L7.5 10H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg></span>
      <span class="menu-text">Leggi le risposte</span>
      <input id="speakSwitch" type="checkbox" class="switch" role="switch" checked>
    </label>
    <button class="menu-row" id="historyBtn" role="menuitem">
      <span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
      <span class="menu-text">Cronologia</span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg>
    </button>
    <button class="menu-row" id="reset" role="menuitem">
      <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4h4"/></svg></span>
      <span class="menu-text">Nuova conversazione</span>
    </button>
  </div>

  <!-- Richiesta di conferma, in stile foglio di sistema -->
  <div id="sheetScrim" class="scrim" hidden></div>
  <section id="approval" class="sheet material-thick" role="dialog" aria-modal="true" aria-labelledby="approvalTitle" hidden>
    <span class="grabber" aria-hidden="true"></span>
    <div class="sheet-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3.5"/><path d="M7 10l3 2.5L7 15M12.5 15H17"/></svg></div>
    <h2 id="approvalTitle" class="sheet-title"></h2>
    <p class="sheet-sub">AI Remote vorrebbe eseguire questa azione sul tuo Mac.</p>
    <pre id="approvalDetail" class="code"></pre>
    <div id="slider" class="slider" role="slider" aria-label="Scorri per eseguire" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <span class="slider-text">scorri per eseguire</span>
      <span class="knob"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></span>
    </div>
    <button id="deny" class="text-btn">Non consentire</button>
  </section>

  <!-- Cronologia -->
  <section id="history" class="page" hidden>
    <div class="page-bar">
      <span></span>
      <button id="historyClose" class="text-btn strong">Fine</button>
    </div>
    <h1 class="large-title">Cronologia</h1>
    <ol id="log" class="grouped"></ol>
  </section>

  <script src="app.js"></script>
</body>
</html>
